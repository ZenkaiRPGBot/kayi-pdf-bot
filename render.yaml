services:
  - type: web
    name: kayi-pdf-bot
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    maxShutdownDelaySeconds: 30
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BOT_TOKEN
        sync: false
      # Owner-only notifications and /usage /restart authorization.
      # Set these in the Render dashboard; never commit a personal ID.
      - key: OWNER_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      # Optional: enables owner /restart through Render's zero-downtime deploy
      # hook. Create it under Settings > Deploy Hook, then paste the secret URL.
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      - key: RENDER_EMAIL
        sync: false
      - key: RENDER_SERVICE_NAME
        value: kayi-pdf-bot
      - key: RENDER_REPO
        value: ZenkaiRPGBot/kayi-pdf-bot
      - key: RENDER_USED_HOURS
        value: "0"
      # Do not set WEBHOOK_SECRET here.  Render's generated base64 value can
      # contain + and /, which the app rejects at startup.  Without the
      # variable it generates a valid URL-safe secret on every start.
      - key: FSUB_CHANNEL
        value: "@KayiBots"
      - key: FSUB_INVITE_URL
        value: https://t.me/KayiBots
      - key: WEBHOOK_AUTO_SET
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_SELF_PING
        value: "true"
      - key: PING_URL
        value: https://kayi-pdf-bot.onrender.com/ping
      - key: SELF_PING_INITIAL_DELAY
        value: "60"
      - key: SELF_PING_INTERVAL
        value: "600"
