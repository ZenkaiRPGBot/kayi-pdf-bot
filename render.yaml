services:
  - type: web
    name: kayi-pdf-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: BOT_TOKEN
        sync: false
      # Do not set WEBHOOK_SECRET here.  Render's generated base64 value can
      # contain + and /, which the app rejects at startup.  Without the
      # variable it generates a valid URL-safe secret on every start.
      - key: FSUB_CHANNEL
        value: "@KayiBots"
      - key: FSUB_INVITE_URL
        value: https://t.me/KayiBots
      - key: WEBHOOK_AUTO_SET
        value: "true"
      - key: LOG_LEVEL
        value: INFO
